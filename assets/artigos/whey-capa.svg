<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Ilustração: aminoácidos do whey saindo da coqueteleira e construindo a fibra muscular">
  <title>Whey protein: tijolinhos para construir músculo</title>
  <style>
    .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .wave { animation: wave 3s ease-in-out infinite; }
    .bead { offset-path: path('M300 190 C 380 60, 470 60, 560 170'); animation: travel 4.5s linear infinite; offset-rotate: 0deg; }
    .d1 { animation-delay: 0s } .d2 { animation-delay: .75s } .d3 { animation-delay: 1.5s }
    .d4 { animation-delay: 2.25s } .d5 { animation-delay: 3s } .d6 { animation-delay: 3.75s }
    .brick { animation: build 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .k2 { animation-delay: .4s } .k3 { animation-delay: .8s } .k4 { animation-delay: 1.2s } .k5 { animation-delay: 1.6s } .k6 { animation-delay: 2s }
    .spark { animation: twinkle 2.4s ease-in-out infinite; } .s2 { animation-delay: .9s }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg) } 50% { transform: translateY(-10px) rotate(-1deg) } }
    @keyframes wave { 0%,100% { transform: translateX(0) } 50% { transform: translateX(-24px) } }
    @keyframes travel { 0% { offset-distance: 0%; opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { offset-distance: 100%; opacity: 0 } }
    @keyframes build { 0%,15% { transform: scaleY(.25); opacity: .35 } 45%,85% { transform: scaleY(1); opacity: 1 } 100% { transform: scaleY(.25); opacity: .35 } }
    @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
  </style>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d9b8"/><stop offset=".5" stop-color="#c9d99a"/><stop offset="1" stop-color="#8fb85a"/>
    </linearGradient>
    <clipPath id="cup"><path d="M170 200 h120 l-14 190 a14 14 0 0 1 -14 13 h-64 a14 14 0 0 1 -14 -13z"/></clipPath>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <circle cx="700" cy="420" r="200" fill="#1aa99a" opacity=".18"/>
  <circle cx="90" cy="60" r="140" fill="#fff" opacity=".35"/>

  <!-- coqueteleira -->
  <g class="float">
    <rect x="182" y="150" width="96" height="30" rx="10" fill="#0e2e33"/>
    <rect x="214" y="128" width="32" height="26" rx="8" fill="#0e2e33"/>
    <path d="M170 186 h120 l-14 204 a14 14 0 0 1 -14 13 h-64 a14 14 0 0 1 -14 -13z" fill="#fff" opacity=".9"/>
    <g clip-path="url(#cup)">
      <path class="wave" d="M140 270 q 30 -14 60 0 t 60 0 t 60 0 t 60 0 V420 H140z" fill="#c9a876"/>
      <path class="wave" style="animation-delay:-1.5s" d="M140 282 q 30 -12 60 0 t 60 0 t 60 0 t 60 0 V420 H140z" fill="#b8925c" opacity=".7"/>
    </g>
    <text x="230" y="250" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#0e2e33">whey</text>
  </g>

  <!-- aminoácidos viajando (L = leucina) -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="15" text-anchor="middle">
    <g class="bead d1"><circle r="17" fill="#1aa99a"/><text y="5" fill="#fff">L</text></g>
    <g class="bead d2"><circle r="14" fill="#0e2e33"/></g>
    <g class="bead d3"><circle r="14" fill="#fff"/></g>
    <g class="bead d4"><circle r="17" fill="#1aa99a"/><text y="5" fill="#fff">L</text></g>
    <g class="bead d5"><circle r="14" fill="#2dc6b4"/></g>
    <g class="bead d6"><circle r="14" fill="#0e2e33"/></g>
  </g>

  <!-- fibra muscular sendo construída -->
  <g>
    <rect x="520" y="390" width="240" height="14" rx="7" fill="#0e2e33" opacity=".25"/>
    <rect class="brick k1" x="530" y="320" width="66" height="66" rx="16" fill="#0e2e33"/>
    <rect class="brick k2" x="604" y="320" width="66" height="66" rx="16" fill="#1aa99a"/>
    <rect class="brick k3" x="678" y="320" width="66" height="66" rx="16" fill="#0e2e33"/>
    <rect class="brick k4" x="567" y="246" width="66" height="66" rx="16" fill="#2dc6b4"/>
    <rect class="brick k5" x="641" y="246" width="66" height="66" rx="16" fill="#fff"/>
    <rect class="brick k6" x="604" y="172" width="66" height="66" rx="16" fill="#1aa99a"/>
  </g>

  <g fill="#fff">
    <path class="spark" d="M470 360 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
    <path class="spark s2" d="M720 120 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>
</svg>
